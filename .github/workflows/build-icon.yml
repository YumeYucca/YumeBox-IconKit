name: Build YumeBox IconKit APK

on:
  issues:
    types: [opened]

concurrency:
  group: yumebox-iconkit-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  triage:
    name: "00 · Check request"
    if: github.event.action == 'opened' && startsWith(github.event.issue.title, '[IconKit]')
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Apply issue labels and enforce the rate limit
        id: gate
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const labels = {
              pending: { name: "iconkit: pending", color: "fbca04", description: "IconKit build is queued" },
              approved: { name: "approved", color: "0e8a16", description: "Passed automated IconKit review" },
              building: { name: "iconkit: building", color: "1d76db", description: "IconKit APK build is running" },
              success: { name: "iconkit: success", color: "2da44e", description: "IconKit APK build completed" },
              failed: { name: "iconkit: failed", color: "d73a4a", description: "IconKit APK build failed" },
              rateLimited: { name: "iconkit: rate-limited", color: "b60205", description: "IconKit Issue creation is temporarily limited" },
            };
            const issue = context.payload.issue;
            const nameOf = (label) => typeof label === "string" ? label : label.name;
            const comment = (body) => github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body,
            });
            for (const label of Object.values(labels)) {
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ...label,
                });
              } catch (error) {
                if (error.status !== 422) throw error;
              }
            }
            const setStatus = async (status) => {
              const { data } = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
              });
              const retained = data.labels.map(nameOf).filter((name) => !name.startsWith("iconkit: "));
              await github.rest.issues.setLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [...retained, labels[status].name],
              });
            };

            const now = Date.now();
            const fourHoursAgo = new Date(now - 4 * 60 * 60 * 1000).toISOString();
            const oneHourAgo = now - 60 * 60 * 1000;
            const exemptUsers = new Set([
              context.repo.owner.toLowerCase(),
              "yumeyuka",
            ]);
            const isExempt = exemptUsers.has(issue.user.login.toLowerCase());
            const { data: recentIssues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: issue.user.login,
              state: "all",
              since: fourHoursAgo,
              per_page: 100,
            });
            const isIconKitIssue = (candidate) =>
              !candidate.pull_request && candidate.title.startsWith("[IconKit]");
            const inCooldown = recentIssues.some((candidate) =>
              candidate.number !== issue.number &&
              isIconKitIssue(candidate) &&
              new Date(candidate.created_at).getTime() >= now - 4 * 60 * 60 * 1000 &&
              candidate.labels.map(nameOf).includes(labels.rateLimited.name),
            );
            const hourlyIssueCount = recentIssues.filter((candidate) =>
              isIconKitIssue(candidate) &&
              new Date(candidate.created_at).getTime() >= oneHourAgo,
            ).length;

            if (!isExempt && (inCooldown || hourlyIssueCount >= 5)) {
              await setStatus("rateLimited");
              await comment(inCooldown
                ? "## IconKit 构建被限流\n\n你已触发创建限流。请在上次被限流四小时后再创建新的构建 Issue。此 Issue 不会构建。"
                : "## IconKit 构建被限流\n\n你在一小时内已创建 5 个 IconKit 构建 Issue。接下来四小时不能创建新的构建 Issue。此 Issue 不会构建。");
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed",
              });
              core.setOutput("allowed", "false");
              return;
            }

            await setStatus("pending");
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [labels.approved.name],
            });
            core.setOutput("allowed", "true");

  prepare:
    name: "01 · Prepare icon"
    needs: triage
    if: needs.triage.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status_comment_id: ${{ steps.build-status.outputs.comment_id }}
    env:
      ICON_WORKER_URL: https://yumebox-iconkit.yumeyuka.moe
      ISSUE_BODY: ${{ github.event.issue.body }}
      YUMEBOX_REPOSITORY: YumeYucca/YumeBox
      YUMEBOX_REF: Moe
    steps:
      - name: Mark build in progress
        id: build-status
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = context.payload.issue;
            const { data } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });
            const nameOf = (label) => typeof label === "string" ? label : label.name;
            const retained = data.labels.map(nameOf).filter((name) => !name.startsWith("iconkit: "));
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...retained, "iconkit: building"],
            });
            const { data: statusComment } = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              body: `[查看构建日志](${context.payload.repository.html_url}/actions/runs/${context.runId})`,
            });
            core.setOutput("comment_id", String(statusComment.id));

      - name: Checkout workflow tools
        uses: actions/checkout@v6
        with:
          path: bridge
          fetch-depth: 1

      - name: Validate issue bundle URL
        run: >-
          python3 bridge/scripts/extract_issue_bundle.py
          --worker-url "$ICON_WORKER_URL"
          --issue-body "$ISSUE_BODY" >> "$GITHUB_ENV"

      - name: Test icon bundle application
        working-directory: bridge
        run: python3 -m unittest discover -s tests -v

      - name: Checkout YumeBox source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.YUMEBOX_REPOSITORY }}
          ref: ${{ env.YUMEBOX_REF }}
          path: yumebox
          submodules: recursive
          fetch-depth: 1

      - name: Apply uploaded icon bundle
        run: >-
          python3 bridge/scripts/apply_icon_bundle.py
          --worker-url "$ICON_WORKER_URL"
          --job-id "$ICON_JOB_ID"
          --download-token "$ICON_DOWNLOAD_TOKEN"
          --target yumebox

      - name: Upload prepared icon resources
        uses: actions/upload-artifact@v7
        with:
          name: iconkit-resources
          path: |
            yumebox/app/res/mipmap-*/ic_launcher*.png
            yumebox/app/res/mipmap-anydpi/ic_launcher.xml
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-geo:
    name: "02 · Geo"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout YumeBox source
        uses: actions/checkout@v6
        with:
          repository: YumeYucca/YumeBox
          ref: Moe
          path: yumebox
          submodules: recursive
          fetch-depth: 1

      - name: Download prepared icon resources
        uses: actions/download-artifact@v8
        with:
          name: iconkit-resources
          path: yumebox/app/res

      - name: Build Geo assets
        working-directory: yumebox
        run: python3 scripts/native-build.py --geo

      - name: Upload Geo artifact
        uses: actions/upload-artifact@v7
        with:
          name: iconkit-geo
          path: yumebox/build/generated/assets/geo
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-native:
    name: "02 · Native (${{ matrix.abi }})"
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v6
        with:
          path: bridge
          fetch-depth: 1

      - name: Checkout YumeBox source
        uses: actions/checkout@v6
        with:
          repository: YumeYucca/YumeBox
          ref: Moe
          path: yumebox
          submodules: recursive
          fetch-depth: 1

      - name: Download prepared icon resources
        uses: actions/download-artifact@v8
        with:
          name: iconkit-resources
          path: yumebox/app/res

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
          cache: false

      - name: Apply Go patches
        run: python3 bridge/scripts/apply_go_patches.py --patch-directory yumebox/.github/patch

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae
        with:
          toolchain: nightly
          targets: aarch64-linux-android
          components: rust-src

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            yumebox/lib/native/rust/target/
          key: ${{ runner.os }}-iconkit-rust-${{ matrix.abi }}-${{ hashFiles('yumebox/lib/native/rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-iconkit-rust-${{ matrix.abi }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ""

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/30.0.14904198
          key: ${{ runner.os }}-iconkit-ndk-30.0.14904198-v1

      - name: Install NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;30.0.14904198"

      - name: Configure Android paths
        run: >-
          python3 bridge/scripts/configure_android_paths.py
          --target yumebox
          --ndk-version 30.0.14904198

      - name: Build native libraries
        working-directory: yumebox
        env:
          ABI_APP_LIST: ${{ matrix.abi }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/30.0.14904198
        run: |
          mkdir -p core/src/foss/golang/mihomo/component/ca
          cp /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/mihomo/component/ca/ca-certificates.crt
          python3 scripts/sync_kernel.py alpha
          python3 scripts/native-build.py --go --rust --compat --loader --ebpf

      - name: Upload native artifact
        uses: actions/upload-artifact@v7
        with:
          name: iconkit-native-${{ matrix.abi }}
          path: yumebox/jniLibs/${{ matrix.abi }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-apk:
    name: "03 · APK (${{ matrix.variant }})"
    needs: [build-geo, build-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: builtin
            artifact_name: YumeBox-IconKit-builtin.apk
          - variant: external
            artifact_name: YumeBox-IconKit-external.apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout workflow tools
        uses: actions/checkout@v6
        with:
          path: bridge
          fetch-depth: 1

      - name: Checkout YumeBox source
        uses: actions/checkout@v6
        with:
          repository: YumeYucca/YumeBox
          ref: Moe
          path: yumebox
          submodules: recursive
          fetch-depth: 0

      - name: Download prepared icon resources
        uses: actions/download-artifact@v8
        with:
          name: iconkit-resources
          path: yumebox/app/res

      - name: Compute YumeBox build version
        id: build-info
        working-directory: yumebox
        run: |
          echo "number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "hash=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(git symbolic-ref --short -q HEAD || printf '%s' Moe)" >> "$GITHUB_OUTPUT"

      - name: Download Geo artifact
        uses: actions/download-artifact@v8
        with:
          name: iconkit-geo
          path: yumebox/build/generated/assets/geo

      - name: Download native artifact
        uses: actions/download-artifact@v8
        with:
          name: iconkit-native-arm64-v8a
          path: yumebox/jniLibs/arm64-v8a

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"

      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@88d53291848568823e529973af5d0cdb8ddf8d87

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ""

      - name: Cache NDK
        id: cache-ndk
        uses: actions/cache@v5
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk/30.0.14904198
          key: ${{ runner.os }}-iconkit-ndk-30.0.14904198-v1

      - name: Install NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: sdkmanager "ndk;30.0.14904198"

      - name: Configure Android paths
        run: >-
          python3 bridge/scripts/configure_android_paths.py
          --target yumebox
          --ndk-version 30.0.14904198

      - name: Restore signing configuration
        env:
          YUMEBOX_DIR: ${{ github.workspace }}/yumebox
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: python3 bridge/scripts/restore_signing.py

      - name: Build ${{ matrix.variant }} APK
        run: >-
          python3 bridge/scripts/build_apks.py
          --target yumebox
          --build-number "${{ steps.build-info.outputs.number }}"
          --build-hash "${{ steps.build-info.outputs.hash }}"
          --build-branch "${{ steps.build-info.outputs.branch }}"
          --variant "${{ matrix.variant }}"

      - name: Upload ${{ matrix.variant }} APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: yumebox/apk-stage/${{ matrix.artifact_name }}
          if-no-files-found: error
          archive: false
          retention-days: 7

  finalize:
    name: "04 · Report result"
    needs: [triage, prepare, build-geo, build-native, build-apk]
    if: always() && needs.triage.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update issue status and comment the result
        uses: actions/github-script@v8
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          GEO_RESULT: ${{ needs.build-geo.result }}
          NATIVE_RESULT: ${{ needs.build-native.result }}
          APK_RESULT: ${{ needs.build-apk.result }}
          STATUS_COMMENT_ID: ${{ needs.prepare.outputs.status_comment_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const issue = context.payload.issue;
            const nameOf = (label) => typeof label === "string" ? label : label.name;
            const expectedArtifacts = ["YumeBox-IconKit-builtin.apk", "YumeBox-IconKit-external.apk"];
            let succeeded = [
              process.env.PREPARE_RESULT,
              process.env.GEO_RESULT,
              process.env.NATIVE_RESULT,
              process.env.APK_RESULT,
            ].every((result) => result === "success");
            const artifactLinks = new Map();
            if (succeeded) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              for (const artifact of data.artifacts) {
                if (expectedArtifacts.includes(artifact.name)) {
                  artifactLinks.set(
                    artifact.name,
                    `${context.payload.repository.html_url}/actions/runs/${context.runId}/artifacts/${artifact.id}`,
                  );
                }
              }
              succeeded = expectedArtifacts.every((name) => artifactLinks.has(name));
            }

            const { data: current } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
            });
            const retained = current.labels.map(nameOf).filter((name) => !name.startsWith("iconkit: "));
            await github.rest.issues.setLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              labels: [...retained, succeeded ? "iconkit: success" : "iconkit: failed"],
            });
            const logs = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;
            const body = succeeded
              ? `## IconKit APK 构建完成\n\n### Choosing an APK variant\n\n- [YumeBox-IconKit-builtin.apk](${artifactLinks.get("YumeBox-IconKit-builtin.apk")}): Includes Geo data; recommended for first-time installation.\n- [YumeBox-IconKit-external.apk](${artifactLinks.get("YumeBox-IconKit-external.apk")}): Smaller APK; recommended for updates.\n- Both variants have the same features.\n\n- [查看构建日志](${logs})`
              : `## IconKit APK 构建未成功\n\n已标记为失败并关闭此 Issue。\n\n- [查看构建日志](${logs})`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.STATUS_COMMENT_ID),
              body,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: "closed",
            });
