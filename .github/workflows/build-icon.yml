name: Build YumeBox IconKit APK

on:
  issues:
    types: [opened]

concurrency:
  group: yumebox-iconkit-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  build:
    name: Build two IconKit APKs
    if: startsWith(github.event.issue.title, '[IconKit]')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      YUMEBOX_REPOSITORY: YumeYucca/YumeBox
      YUMEBOX_REF: Moe
      ICON_WORKER_URL: https://yumebox-iconkit.yumeyuka.moe
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ARTIFACT_NAME: YumeBox-IconKit-issue-${{ github.event.issue.number }}

    steps:
      - name: Resolve job URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actions_job_url="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
            | jq -r '.jobs[0].html_url // empty')"
          echo "ACTIONS_URL=${actions_job_url:-$ACTIONS_RUN_URL}" >> "$GITHUB_ENV"

      - name: Checkout workflow tools
        uses: actions/checkout@v6
        with:
          path: bridge
          fetch-depth: 1

      - name: Validate issue bundle URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python3 bridge/scripts/extract_issue_bundle.py \
            --worker-url "$ICON_WORKER_URL" \
            --issue-body "$ISSUE_BODY" >> "$GITHUB_ENV"; then
            exit 0
          fi
          curl --fail --silent --show-error --request POST \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --data "$(jq -nc --arg body '无法读取有效的 IconKit R2 链接，构建未开始。请从图标编辑器重新创建构建 Issue。' '{body: $body}')"
          exit 1

      - name: Comment build started
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --data "$(jq -nc --arg body "已收到图标包，正在构建 APK。可在此查看构建进度：$ACTIONS_URL" '{body: $body}')"

      - name: Test icon bundle application
        working-directory: bridge
        run: python3 -m unittest discover -s tests -v

      - name: Checkout YumeBox source
        uses: actions/checkout@v6
        with:
          repository: ${{ env.YUMEBOX_REPOSITORY }}
          ref: ${{ env.YUMEBOX_REF }}
          path: yumebox
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"

      - name: Setup Kotlin
        uses: fwilhe2/setup-kotlin@88d53291848568823e529973af5d0cdb8ddf8d87

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
          cache: false

      - name: Apply Go patches
        run: python3 bridge/scripts/apply_go_patches.py --patch-directory yumebox/.github/patch

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@efcb852328a9f50117170cc43094fb6f09eaf1ae
        with:
          toolchain: nightly
          targets: aarch64-linux-android
          components: rust-src

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ""

      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      - name: Configure Android paths
        run: >-
          python3 bridge/scripts/configure_android_paths.py
          --target yumebox
          --ndk-version 30.0.14904198

      - name: Build Geo and native inputs
        env:
          ABI_APP_LIST: arm64-v8a
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/30.0.14904198
        run: python3 bridge/scripts/build_native.py --target yumebox

      - name: Apply uploaded icon bundle
        run: >-
          python3 bridge/scripts/apply_icon_bundle.py
          --worker-url "$ICON_WORKER_URL"
          --job-id "$ICON_JOB_ID"
          --download-token "$ICON_DOWNLOAD_TOKEN"
          --target yumebox

      - name: Restore signing configuration
        env:
          YUMEBOX_DIR: ${{ github.workspace }}/yumebox
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: python3 bridge/scripts/restore_signing.py

      - name: Build builtin and external APKs
        run: >-
          python3 bridge/scripts/build_apks.py
          --target yumebox
          --build-number "${{ github.run_number }}"
          --build-hash "${GITHUB_SHA:0:8}"

      - name: Upload two APK files
        id: upload-apks
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            yumebox/apk-stage/YumeBox-IconKit-builtin.apk
            yumebox/apk-stage/YumeBox-IconKit-external.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Comment build result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SUCCEEDED: ${{ job.status == 'success' && 'true' || 'false' }}
          ARTIFACT_URL: ${{ steps.upload-apks.outputs.artifact-url }}
        run: |
          if [ "$BUILD_SUCCEEDED" = "true" ]; then
            body="构建完成。下载 APK 工件：$ARTIFACT_URL\n\n构建日志：$ACTIONS_URL"
          else
            body="构建失败。请查看构建日志：$ACTIONS_URL"
          fi
          curl --fail --silent --show-error --request POST \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --data "$(jq -nc --arg body "$body" '{body: $body}')"
