name = "yumebox-iconkit"
main = "worker/index.ts"
compatibility_date = "2026-08-17"
# Preserve runtime variables and secrets configured in Cloudflare across Git deployments.
keep_vars = true

[[r2_buckets]]
binding = "ICON_BUNDLES"
bucket_name = "yumebox-iconkit-jobs"

[vars]
GITHUB_OWNER = "YumeYucca"
GITHUB_REPO = "YumeBox-IconKit"
GITHUB_WORKFLOW = "build-icon.yml"
GITHUB_REF = "Moe"
# Mintlify documentation origins allowed to submit icon jobs.
ALLOWED_ORIGINS = "https://yumebox.gal.tf,https://yumebox.mintlify.app"
